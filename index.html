<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Les jeux - Accueil</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="menu">

    <nav>
      <a href="index.html" class="actif">Accueil</a>
      <a href="page2.html">Jeux</a>
    </nav>
  </header>
 
  <main>
    <section class="hero">
      <h1>Envie de t'amuser ? </h1>
      <div id="horloge-accueil">
        <span id="date"></span> · <span id="heure"></span>
      </div>
    </section>

    <section class="apercu">
      <h2 class="titre-choix">Choisis ton jeu</h2>
      <div class="blocs">
        <a href="page2.html#nombre" class="carte carte-jeu lien-carte">
          <div class="icone">🎯</div>
          <h2>Devine le nombre</h2>
          <p>Trouve le nombre secret.</p>
        </a>
        <a href="page2.html#pendu" class="carte carte-jeu lien-carte">
          <div class="icone">🔤</div>
          <h2>Pendu</h2>
          <p>Devine le mot lettre par lettre.</p>
        </a>
        <a href="page2.html#snake" class="carte carte-jeu lien-carte">
          <div class="icone">🐍</div>
          <h2>Snake</h2>
          <p>Mange les pommes sans te cogner.</p>
        </a>
      </div>
    </section>
  </main>

  <footer class="pied">
    <p>© 2026 Selma · Tous droits réservés</p>
  </footer>

  <script>
    function majHorloge() {
      const maintenant = new Date();
      document.getElementById("date").textContent =
        maintenant.toLocaleDateString("fr-FR", {
          weekday: "long", day: "numeric", month: "long", year: "numeric"
        });
      document.getElementById("heure").textContent =
        maintenant.toLocaleTimeString("fr-FR");
    }
    majHorloge();
    setInterval(majHorloge, 1000);
  </script>

</body>
</html>
